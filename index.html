<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ボタン</title>
<style>
  :root {
    --mx: 50vw;
    --my: 50vh;
    --pulse: 1;
    --glow: 0.8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    overflow: hidden;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at var(--mx) var(--my), rgba(255, 50, 120, .18), transparent 22%),
      radial-gradient(circle at 50% 50%, #24102d 0, #09070d 42%, #030305 100%);
    transition: background .35s ease;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -15%;
    background:
      repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.025) 0 1px, transparent 1px 36px),
      conic-gradient(from 0deg, transparent, rgba(255, 34, 102, .08), transparent 28%, rgba(148, 70, 255, .06), transparent 60%);
    filter: blur(1px);
    animation: rotate 22s linear infinite;
    pointer-events: none;
  }
  @keyframes rotate { to { transform: rotate(360deg) scale(1.05); } }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    perspective: 1200px;
    isolation: isolate;
  }

  .top {
    position: absolute;
    top: 9vh;
    text-align: center;
    z-index: 5;
    user-select: none;
  }
  .eyebrow {
    display: inline-block;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    backdrop-filter: blur(10px);
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: .7;
  }
  h1 {
    margin: 17px 0 8px;
    font-size: clamp(32px, 5vw, 68px);
    line-height: .96;
    letter-spacing: -.055em;
    font-weight: 900;
    text-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  .sub {
    margin: 0;
    font-size: clamp(13px, 1.5vw, 16px);
    color: rgba(255,255,255,.56);
  }

  .orbit {
    position: absolute;
    width: min(66vw, 690px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid rgba(255, 90, 150, .11);
    box-shadow: inset 0 0 80px rgba(255, 35, 115, .05);
    animation: breathe 3.3s ease-in-out infinite;
  }
  .orbit::before,
  .orbit::after {
    content: "";
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    border: 1px solid rgba(186, 80, 255, .08);
  }
  .orbit::after { inset: 19%; }
  @keyframes breathe {
    0%,100% { transform: scale(.97); opacity: .72; }
    50% { transform: scale(1.03); opacity: 1; }
  }

  .button-wrap {
    position: relative;
    z-index: 10;
    width: min(58vw, 360px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }

  .halo {
    position: absolute;
    width: 92%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 54, 119, .26), transparent 64%);
    filter: blur(18px);
    transform: scale(calc(1 + .06 * var(--pulse)));
    animation: halo 1.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes halo {
    0%,100% { opacity: .65; }
    50% { opacity: 1; transform: scale(1.12); }
  }

  button {
    position: relative;
    width: 78%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 0;
    cursor: pointer;
    color: #fff;
    background:
      radial-gradient(circle at 38% 30%, rgba(255,255,255,.44), transparent 12%),
      radial-gradient(circle at 50% 42%, #ff5a9a 0, #ff2f73 30%, #cc174e 62%, #6c0a2c 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.1) inset,
      0 0 0 9px rgba(255,255,255,.025),
      0 8px 24px rgba(0,0,0,.35),
      0 0 55px rgba(255, 35, 105, .55),
      0 0 120px rgba(255, 35, 105, .22);
    transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(calc(1 + .028 * var(--pulse)));
    transition: transform .13s cubic-bezier(.2,.85,.2,1), filter .13s ease, box-shadow .13s ease;
    animation: magnet 2.3s ease-in-out infinite;
  }
  button::before {
    content: "";
    position: absolute;
    inset: 4%;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 -8px 18px rgba(255,255,255,.1) inset;
  }
  button::after {
    content: "";
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    border: 1px solid rgba(255, 78, 139, .25);
    animation: ring 1.55s ease-out infinite;
  }
  @keyframes ring {
    0% { transform: scale(.93); opacity: .65; }
    100% { transform: scale(1.15); opacity: 0; }
  }
  @keyframes magnet {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.08) saturate(1.08); }
  }

  button:hover {
    filter: brightness(1.12) saturate(1.1);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.1) inset,
      0 0 0 11px rgba(255,255,255,.025),
      0 12px 28px rgba(0,0,0,.4),
      0 0 75px rgba(255, 35, 105, .72),
      0 0 150px rgba(255, 35, 105, .28);
  }
  button:active {
    --pulse: 0;
    transform: translate(0, 2px) scale(.95);
  }

  .label {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    text-shadow: 0 6px 18px rgba(0,0,0,.24);
  }
  .label strong {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 950;
    letter-spacing: -.05em;
  }
  .label span {
    font-size: 12px;
    letter-spacing: .16em;
    opacity: .75;
  }

  .hint {
    position: absolute;
    bottom: 8vh;
    z-index: 5;
    text-align: center;
    color: rgba(255,255,255,.45);
    font-size: 12px;
    animation: hint 2.8s ease-in-out infinite;
    user-select: none;
  }
  @keyframes hint { 0%,100% { transform: translateY(0); opacity:.35; } 50% { transform: translateY(-5px); opacity:.75; } }

  .flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.95), rgba(255,80,140,.34) 18%, transparent 58%);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }
  body.pressed .flash { animation: flash .5s ease-out; }
  @keyframes flash { 0%{opacity:0} 16%{opacity:1} 100%{opacity:0} }

  .toast {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.85);
    z-index: 60;
    padding: 14px 20px;
    border-radius: 999px;
    background: rgba(10,8,14,.78);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(14px);
    font-weight: 800;
    letter-spacing: -.02em;
    opacity: 0;
    pointer-events: none;
  }
  body.pressed .toast { animation: toast .75s cubic-bezier(.2,.8,.2,1); }
  @keyframes toast { 0% { opacity:0; transform:translate(-50%,-50%) scale(.75); } 30%{opacity:1; transform:translate(-50%,-50%) scale(1.04);} 70%{opacity:1; transform:translate(-50%,-50%) scale(1);} 100%{opacity:0; transform:translate(-50%,-50%) scale(1.04);} }

  .spark {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 14px #fff;
    pointer-events: none;
    z-index: 40;
    animation: fly .8s ease-out forwards;
  }

  /* 押した後に表示する全画面動画 */
  .video-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: grid;
    place-items: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 9999;
    transition: opacity .28s ease, visibility .28s ease;
  }
  .video-screen.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  .video-screen video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }

  /* 全画面化したときも動画を確実に敷き詰める */
  .video-screen:fullscreen {
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  .video-screen:fullscreen video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
  @keyframes fly {
    to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  @media (max-width: 600px) {
    .top { top: 8vh; }
    .orbit { width: 92vw; }
    .button-wrap { width: 86vw; }
    .hint { bottom: 7vh; }
  }


  /* 動画中は、一般的な動画プレイヤーのUIに見える控えめな×ボタン。
     押すと停止ではなく、さらに同じ動画を重ねて再生する。 */
  .video-controls {
    position: fixed;
    top: 18vh;
    right: 11vw;
    z-index: 100000;
    pointer-events: none;
  }

  .fake-stop {
    position: relative;
    width: 56px;
    height: 56px;
    padding: 0;
    pointer-events: auto;
    appearance: none;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 5px;
    background: rgba(0,0,0,.48);
    color: rgba(255,255,255,.88);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(0,0,0,.24);
    transition: background .15s ease, transform .12s ease, opacity .15s ease;
    user-select: none;
    opacity: .86;
  }

  .fake-stop::before,
  .fake-stop::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 23px;
    height: 1.5px;
    border-radius: 999px;
    background: currentColor;
    transform-origin: center;
  }

  .fake-stop::before { transform: translate(-50%, -50%) rotate(45deg); }
  .fake-stop::after  { transform: translate(-50%, -50%) rotate(-45deg); }

  .fake-stop:hover {
    background: rgba(0,0,0,.62);
    opacity: 1;
  }

  .fake-stop:active {
    transform: scale(.94);
  }

  .video-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }

  /* 重ねるたびにごくわずかな変化を付け、何層も再生されている感じを出す */
  .video-layer.overlay {
    opacity: .96;
    transform: scale(1.002);
  }

  @media (max-width: 600px) {
    .video-controls { top: 13vh; right: 7vw; }
    .fake-stop { width: 50px; height: 50px; }
  }

</style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="top">
      <h1>押してみて！</h1>
      <p class="sub">何が起こるかな？</p>
    </div>

    <div class="orbit" aria-hidden="true"></div>

    <div class="button-wrap" id="buttonWrap">
      <div class="halo"></div>
      <button id="tempt" aria-label="押す">
        <div class="label">
          <strong>押す</strong>
          <span>PRESS</span>
        </div>
      </button>
    </div>

    <div class="hint">こっち見んな</div>
  </main>

  <div class="flash"></div>
  <div class="toast" id="toast">gg</div>

  <div class="video-screen" id="videoScreen" aria-hidden="true">
    <video id="surpriseVideo" src="video.mp4" playsinline preload="auto"></video>
    <div class="video-controls" id="videoControls" aria-hidden="true">
      <button class="fake-stop" id="fakeStop" type="button" aria-label="閉じる">×</button>
    </div>
  </div>

<script>
(() => {
  const button = document.getElementById('tempt');
  const buttonWrap = document.getElementById('buttonWrap');
  const scene = document.getElementById('scene');
  const videoScreen = document.getElementById('videoScreen');
  const surpriseVideo = document.getElementById('surpriseVideo');

  let lastX = innerWidth / 2;
  let lastY = innerHeight / 2;
  let pressed = false;
  let movingToPoint = false;
  let layerCount = 1;

  const fakeStop = document.getElementById('fakeStop');
  const videoControls = document.getElementById('videoControls');

  function setMouse(x, y) {
    lastX = x; lastY = y;
    document.documentElement.style.setProperty('--mx', x + 'px');
    document.documentElement.style.setProperty('--my', y + 'px');

    if (pressed || movingToPoint) return;

    const r = button.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dx = x - cx, dy = y - cy;
    const dist = Math.hypot(dx, dy);
    const influence = Math.max(0, 1 - dist / 420);

    const pull = influence * 18;
    button.style.setProperty('--tx', ((dx / Math.max(dist, 1)) * pull).toFixed(2) + 'px');
    button.style.setProperty('--ty', ((dy / Math.max(dist, 1)) * pull).toFixed(2) + 'px');
    document.documentElement.style.setProperty('--pulse', influence.toFixed(2));
  }

  window.addEventListener('pointermove', e => setMouse(e.clientX, e.clientY), { passive: true });

  function teleportButton(x, y) {
    movingToPoint = true;
    buttonWrap.style.position = 'fixed';
    buttonWrap.style.left = x + 'px';
    buttonWrap.style.top = y + 'px';
    buttonWrap.style.transform = 'translate(-50%, -50%)';
    button.style.setProperty('--tx', '0px');
    button.style.setProperty('--ty', '0px');

    button.animate([
      { transform: 'scale(0.72)', filter: 'brightness(1.8) saturate(1.3)' },
      { transform: 'scale(1.12)', filter: 'brightness(1.25) saturate(1.15)', offset: 0.42 },
      { transform: 'scale(1)', filter: 'brightness(1)' }
    ], { duration: 150, easing: 'cubic-bezier(.15,.8,.2,1)' });
  }

  async function playVideoElement(video) {
    video.muted = false;
    video.volume = 1;
    video.currentTime = 0;
    try {
      await video.play();
    } catch (err) {
      console.warn('動画の再生に失敗しました:', err);
    }
  }

  async function addOverlayVideo() {
    const overlay = surpriseVideo.cloneNode(false);
    overlay.removeAttribute('id');
    overlay.className = 'video-layer overlay';
    overlay.setAttribute('playsinline', '');
    overlay.setAttribute('preload', 'auto');
    overlay.style.zIndex = String(10 + layerCount);
    videoScreen.insertBefore(overlay, videoControls);

    layerCount += 1;
    await playVideoElement(overlay);

    // 触るたびに少しだけ画面を揺らして、積み重なった感を強調
    videoScreen.animate([
      { transform: 'scale(1)' },
      { transform: 'scale(1.006)' },
      { transform: 'scale(1)' }
    ], { duration: 180, easing: 'ease-out' });
  }

  async function pressAt(x, y) {
    if (pressed) return;
    pressed = true;
    teleportButton(x, y);

    document.body.classList.remove('pressed');
    void document.body.offsetWidth;
    document.body.classList.add('pressed');
    navigator.vibrate?.([18, 35, 18]);
    spawnSparks(x, y);

    surpriseVideo.muted = false;
    surpriseVideo.volume = 1;
    surpriseVideo.currentTime = 0;

    videoScreen.classList.add('show');
    videoScreen.setAttribute('aria-hidden', 'false');
    videoControls.setAttribute('aria-hidden', 'false');

    try {
      await surpriseVideo.play();
    } catch (err) {
      console.warn('動画の再生に失敗しました:', err);
    }

    try {
      if (!document.fullscreenElement && videoScreen.requestFullscreen) {
        await videoScreen.requestFullscreen();
      }
    } catch (err) {
      // 全画面APIが拒否されても、動画オーバーレイ自体は画面全体に表示される
    }
  }

  document.addEventListener('pointerdown', e => {
    if (pressed || videoScreen.classList.contains('show')) return;
    pressAt(e.clientX, e.clientY);
  }, { capture: true });

  button.addEventListener('click', e => {
    if (pressed) return;
    pressAt(e.clientX || lastX, e.clientY || lastY);
  });

  // ×を押しても閉じず、さらに同じ動画を重ねて再生する。
  fakeStop.addEventListener('click', async e => {
    e.preventDefault();
    e.stopPropagation();
    if (!videoScreen.classList.contains('show')) return;
    navigator.vibrate?.([12, 22, 12]);
    await addOverlayVideo();
  });

  // 各動画が終わっても、他の動画が残っている間は表示を維持する。
  surpriseVideo.addEventListener('ended', () => {
    // 最初の動画が終わった場合でも、重ねた動画が再生中なら何もしない。
  });

  videoScreen.addEventListener('click', e => {
    if (e.target !== videoScreen && e.target !== surpriseVideo) return;
    // 動画そのものをタップした場合も、停止ではなくさらに重ねる。
    if (videoScreen.classList.contains('show')) addOverlayVideo();
  });

  function spawnSparks(x, y) {
    const cx = x;
    const cy = y;
    for (let i = 0; i < 28; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      const a = Math.random() * Math.PI * 2;
      const d = 70 + Math.random() * 220;
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      s.style.animationDelay = (Math.random() * 0.08) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1000);
    }
  }

  // 何もしない時間も中央へ視線を誘導し続ける微妙な変化
  let t = 0;
  function idle() {
    t += 0.018;
    if (!pressed && !movingToPoint) {
      const x = Math.sin(t * .73) * 4;
      const y = Math.cos(t * .61) * 3;
      button.style.setProperty('--tx', x + 'px');
      button.style.setProperty('--ty', y + 'px');
    }
    requestAnimationFrame(idle);
  }
  idle();
})();
</script>
</body>
</html>
